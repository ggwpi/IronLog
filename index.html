  <script>
    (function () {
      var BUILD = 'home-ref-20260911-01';
      window.__IRONLOG_BUILD__ = BUILD;

      function withBuild(url, build) {
        var next = new URL(url, location.origin);
        next.searchParams.set('build', build);
        return next.pathname + next.search + next.hash;
      }

      var currentBuild = new URL(location.href).searchParams.get('build');
      if (currentBuild !== BUILD) {
        location.replace(withBuild(location.href, BUILD));
        return;
      }

      async function checkForNewBuild() {
        try {
          var response = await fetch('/?_ironlog_build=' + Date.now(), { cache: 'no-store' });
          if (!response.ok) return;
          var html = await response.text();
          var match = html.match(/<meta\s+name=["']ironlog-build["']\s+content=["']([^"']+)["']/i);
          var latest = match && match[1];
          if (latest && latest !== BUILD) location.replace(withBuild(location.href, latest));
        } catch (_) {
          // Version checking must never prevent the app from opening offline.
        }
      }

      window.addEventListener('pageshow', function (event) {
        if (event.persisted) checkForNewBuild();
      });
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') checkForNewBuild();
      });
    })();
  </script>
