<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="IronLog — your training, clearly tracked.">
  <title>IronLog</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/src/styles.css">
  <link rel="stylesheet" href="/src/features/home/home.css">
  <link rel="stylesheet" href="/src/features/home/workout-image.css">
  <link rel="stylesheet" href="/src/features/workouts/workouts.css">
  <link rel="stylesheet" href="/src/features/workouts/workouts-reference-tune.css">
  <link rel="stylesheet" href="/src/features/statistics/statistics.css">
  <link rel="stylesheet" href="/src/nav-glass.css">
  <link rel="stylesheet" href="/src/features/home/home-reference-fix.css">
  <link rel="stylesheet" href="/src/features/home/home-anatomy-tune.css">
  <link rel="stylesheet" href="/src/features/home/home-header-tune.css">
  <link rel="stylesheet" href="/src/nav-fixed.css">
  <link rel="stylesheet" href="/src/motion.css">
  <link rel="stylesheet" href="/src/features/statistics/statistics-reference-tune.css">
  <link rel="stylesheet" href="/src/features/statistics/statistics-concept-fix.css">
  <link rel="stylesheet" href="/src/features/statistics/statistics-final-tune.css">
  <link rel="stylesheet" href="/src/features/statistics/statistics-motion.css">
  <link rel="stylesheet" href="/src/app-header.css">
</head>
<body>
  <div id="app">
    <main class="auth-shell" id="bootFallback">
      <section class="auth-panel animate-enter">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
          <div><strong>IRONLOG</strong><small>TRAIN. TRACK. PROGRESS.</small></div>
        </div>
        <div class="auth-copy">
          <span class="eyebrow">LOADING</span>
          <h1>IronLog<br><em>נטען עכשיו.</em></h1>
          <p>אם המסך הזה נשאר יותר מרגע, רענן את העמוד פעם אחת.</p>
        </div>
      </section>
    </main>
  </div>
  <noscript>IronLog requires JavaScript.</noscript>
  <script>
    window.addEventListener('error', function () {
      var fallback = document.getElementById('bootFallback');
      if (!fallback) return;
      var eyebrow = fallback.querySelector('.eyebrow');
      var title = fallback.querySelector('h1');
      var copy = fallback.querySelector('p');
      if (eyebrow) eyebrow.textContent = 'STARTUP ERROR';
      if (title) title.innerHTML = 'לא הצלחנו לפתוח את<br><em>IronLog.</em>';
      if (copy) copy.textContent = 'נסה לרענן את העמוד. אם זה ממשיך, האפליקציה תציג עכשיו שגיאה במקום מסך שחור.';
    });
    window.addEventListener('unhandledrejection', function () {
      window.dispatchEvent(new Event('error'));
    });
  </script>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
