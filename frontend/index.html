<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="dark">
<!-- Paint the document itself before reset/imports can delay the app stylesheet.
     The boot overlay alone does not color iOS's canvas or home-indicator area. -->
<style>
  html{color-scheme:dark;background:#000}
  body{margin:0;min-height:100vh;min-height:100dvh;background:inherit}
</style>
<script>
  // Set direction before first paint so an Arabic profile never flashes as LTR.
  // The app re-applies this on every language change (lib/i18n.js setLang).
  // i18n-core RTL_LANGS is the runtime source of truth — keep this list in sync.
  try {
    var s = JSON.parse(localStorage.getItem('gym_state_v1') || '{}');
    var l = s.lang || ((navigator.language || '').slice(0, 2) === 'ar' ? 'ar' : 'en');
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  } catch (e) {}
</script>
<title>IronLog</title>
<meta name="description" content="Personal gym & body weight tracker">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="IronLog">
<!-- use-credentials: browsers fetch the manifest without cookies, even same-origin; behind an auth
     proxy (Authelia, Cloudflare Access, Teleport…) that fetch is a login redirect and the Home Screen
     icon comes out generic. iOS 26 reads the icon from the manifest, so this is where it shows. -->
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
</head>
<body>
<!-- Complete startup artwork is available in the first HTML, without asset or shader loading. -->
<style>
  #boot{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;transition:opacity .22s ease-out}
  #boot .boot-stage{position:relative;width:min(328px,calc(100vw - 40px),45svh);aspect-ratio:288/448;font-size:min(36px,9.2vw,5svh)}
  #boot .boot-outline{display:block;width:100%;height:100%;overflow:visible;fill:none;stroke:#27ff00;stroke-linecap:round;stroke-linejoin:round}
  #boot .boot-shape{stroke-width:1.25;opacity:.18;vector-effect:non-scaling-stroke}
  #boot .boot-trace{stroke-width:2;stroke-dasharray:18 82;vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 5px #27ff00);animation:boot-outline-loop 2.4s linear infinite}
  #boot .boot-wordmark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:max-content;line-height:1.2;font-weight:650;letter-spacing:-1.3px}
  #boot .boot-wordmark span{color:#a1a1aa;animation:boot-shimmer 1.2s ease-in-out infinite;animation-delay:calc(var(--i)*.12s)}
  #boot.out{opacity:0;pointer-events:none}
  @keyframes boot-outline-loop{to{stroke-dashoffset:-100}}
  @keyframes boot-shimmer{0%,100%{color:#a1a1aa}50%{color:#fff}}
  @media(prefers-reduced-motion:reduce){
    #boot .boot-trace,#boot .boot-wordmark span{animation:none}
    #boot .boot-wordmark span{color:#fff}
    #boot .boot-shape{opacity:.35}
    #boot{transition-duration:.12s}
  }
</style>
<div id="boot" role="status" aria-label="Loading IronLog" dir="ltr">
  <div class="boot-stage" aria-hidden="true">
    <svg class="boot-outline" viewBox="112 32 288 448" focusable="false">
      <path class="boot-shape" d="M302 75 147 310h101l-39 127 166-241H274L302 75Z"/>
      <path class="boot-trace" pathLength="100" d="M302 75 147 310h101l-39 127 166-241H274L302 75Z"/>
    </svg>
    <div class="boot-wordmark"><span style="--i:0">I</span><span style="--i:1">r</span><span style="--i:2">o</span><span style="--i:3">n</span><span style="--i:4">L</span><span style="--i:5">o</span><span style="--i:6">g</span></div>
  </div>
</div>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
