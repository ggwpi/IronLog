<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="dark">
<!-- Paint the document itself before reset/imports can delay the app stylesheet.
     The boot overlay alone does not color iOS's canvas or home-indicator area. -->
<style>
  html{color-scheme:dark;background:#000}
  body{margin:0;min-height:100vh;min-height:100dvh;background:inherit}
</style>
<script>
  // Set direction before first paint so an Arabic profile never flashes as LTR.
  // The app re-applies this on every language change (lib/i18n.js setLang).
  // i18n-core RTL_LANGS is the runtime source of truth — keep this list in sync.
  try {
    var s = JSON.parse(localStorage.getItem('gym_state_v1') || '{}');
    var l = s.lang || ((navigator.language || '').slice(0, 2) === 'ar' ? 'ar' : 'en');
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  } catch (e) {}
</script>
<title>IronLog</title>
<meta name="description" content="Personal gym & body weight tracker">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="IronLog">
<!-- use-credentials: browsers fetch the manifest without cookies, even same-origin; behind an auth
     proxy (Authelia, Cloudflare Access, Teleport…) that fetch is a login redirect and the Home Screen
     icon comes out generic. iOS 26 reads the icon from the manifest, so this is where it shows. -->
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
</head>
<body>
<!-- Available before JavaScript: the original IronLog bolt, animated with CSS. -->
<style>
  #boot{--boot-accent:#d2ff16;position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;transition:opacity .22s ease-out}
  #boot .boot-stage{position:relative;display:flex;flex-direction:column;align-items:center;isolation:isolate;padding:32px;transform:translateY(-12px)}
  #boot .boot-halo{position:absolute;z-index:-1;top:-80px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(126,167,18,.13),transparent 65%);animation:boot-breathe 2.8s ease-in-out infinite}
  #boot .boot-mark{position:relative;width:100px;height:100px;animation:boot-arrive .55s cubic-bezier(.16,1,.3,1) both}
  #boot svg{display:block;width:100%;height:100%;overflow:visible}
  #boot .boot-frame{stroke:rgba(210,255,22,.3);stroke-dasharray:440;stroke-dashoffset:440;animation:boot-frame .9s cubic-bezier(.22,1,.36,1) forwards}
  #boot .boot-bolt{fill:var(--boot-accent);transform-origin:50% 50%;animation:boot-charge .9s ease-out both}
  #boot .boot-outline{fill:none;stroke:var(--boot-accent);stroke-width:3;stroke-linejoin:round;stroke-dasharray:920;stroke-dashoffset:920;animation:boot-trace .8s cubic-bezier(.4,0,.2,1) both}
  #boot .boot-wordmark{margin-top:22px;font-size:32px;line-height:1.15;font-weight:750;letter-spacing:-1.3px;animation:boot-word .55s .08s ease-out both}
  #boot .boot-loading{display:flex;align-items:center;gap:8px;margin-top:20px;color:rgba(235,235,245,.48);font-size:10px;line-height:1.4;font-weight:500;letter-spacing:2.2px;text-transform:uppercase;animation:boot-word .5s .16s ease-out both}
  #boot .boot-dot{width:4px;height:4px;border-radius:50%;background:var(--boot-accent);animation:boot-dot 1.5s ease-in-out infinite}
  #boot .boot-track{width:72px;height:2px;margin-top:12px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
  #boot .boot-track::after{content:'';display:block;width:28px;height:100%;border-radius:inherit;background:var(--boot-accent);animation:boot-sweep 1.4s cubic-bezier(.65,0,.35,1) infinite}
  #boot.out{opacity:0;pointer-events:none}
  @keyframes boot-arrive{from{transform:translateY(8px) scale(.9)}to{transform:translateY(0) scale(1)}}
  @keyframes boot-word{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
  @keyframes boot-frame{to{stroke-dashoffset:0}}
  @keyframes boot-trace{0%{stroke-dashoffset:920;opacity:1}75%{opacity:1}100%{stroke-dashoffset:0;opacity:0}}
  @keyframes boot-charge{0%,25%{fill-opacity:.12}100%{fill-opacity:1}}
  @keyframes boot-breathe{0%,100%{opacity:.5;transform:scale(.95)}50%{opacity:1;transform:scale(1.04)}}
  @keyframes boot-dot{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes boot-sweep{from{transform:translateX(-28px)}to{transform:translateX(100px)}}
  @media(prefers-reduced-motion:reduce){
    #boot .boot-stage *,#boot .boot-track::after{animation:none!important}
    #boot .boot-frame{stroke-dashoffset:0}#boot .boot-outline{display:none}
    #boot .boot-track::after{width:100%;opacity:.5}#boot{transition-duration:.12s}
  }
</style>
<div id="boot" role="status" aria-label="Loading IronLog" dir="ltr">
  <div class="boot-stage" aria-hidden="true">
    <div class="boot-halo"></div>
    <div class="boot-mark">
      <svg viewBox="0 0 512 512" focusable="false">
        <defs><radialGradient id="boot-logo-ground" cx="50%" cy="42%" r="62%"><stop offset="0" stop-color="#12180c"/><stop offset=".58" stop-color="#070a08"/><stop offset="1" stop-color="#030504"/></radialGradient></defs>
        <rect width="512" height="512" rx="118" fill="url(#boot-logo-ground)"/>
        <rect x="10" y="10" width="492" height="492" rx="108" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
        <rect class="boot-frame" x="10" y="10" width="492" height="492" rx="108" fill="none" stroke-width="2" pathLength="440"/>
        <path class="boot-bolt" d="M302 75 147 310h101l-39 127 166-241H274L302 75Z"/>
        <path class="boot-outline" d="M302 75 147 310h101l-39 127 166-241H274L302 75Z" pathLength="920"/>
      </svg>
    </div>
    <div class="boot-wordmark">IronLog</div>
    <div class="boot-loading" lang="en"><span class="boot-dot"></span>Loading</div>
    <div class="boot-track"></div>
  </div>
</div>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
