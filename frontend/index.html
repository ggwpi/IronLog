<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="dark">
<!-- Paint the document itself before reset/imports can delay the app stylesheet.
     The boot overlay alone does not color iOS's canvas or home-indicator area. -->
<style>
  html{color-scheme:dark;background:#000}
  body{margin:0;min-height:100vh;min-height:100dvh;background:inherit}
</style>
<script>
  // Set direction before first paint so an Arabic profile never flashes as LTR.
  // The app re-applies this on every language change (lib/i18n.js setLang).
  // i18n-core RTL_LANGS is the runtime source of truth — keep this list in sync.
  try {
    var s = JSON.parse(localStorage.getItem('gym_state_v1') || '{}');
    var l = s.lang || ((navigator.language || '').slice(0, 2) === 'ar' ? 'ar' : 'en');
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  } catch (e) {}
</script>
<title>IronLog</title>
<meta name="description" content="Personal gym & body weight tracker">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="IronLog">
<!-- use-credentials: browsers fetch the manifest without cookies, even same-origin; behind an auth
     proxy (Authelia, Cloudflare Access, Teleport…) that fetch is a login redirect and the Home Screen
     icon comes out generic. iOS 26 reads the icon from the manifest, so this is where it shows. -->
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
</head>
<body>
<!-- Black first paint; reveal the complete startup artwork after its first rendered frame. -->
<style>
  #boot{--boot-accent:#27ff00;position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;transition:opacity .22s ease-out}
  #boot .boot-stage{display:flex;flex-direction:column;align-items:center;padding:24px;transform:translateY(-12px);visibility:hidden}
  #boot .boot-stage.ready{visibility:visible}
  #boot .boot-mark{position:relative;width:176px;height:176px;margin-bottom:4px}
  #boot .boot-wordmark{font-size:40px;line-height:1.2;font-weight:650;letter-spacing:-1.4px}
  #boot-enhancement{position:absolute;inset:0;display:grid;place-items:center}
  #boot.out{opacity:0;pointer-events:none}
  @media(prefers-reduced-motion:reduce){
    #boot{transition-duration:.12s}
  }
</style>
<div id="boot" role="status" aria-label="Loading IronLog" dir="ltr">
  <div id="boot-enhancement" aria-hidden="true"></div>
</div>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
