name: Recover LEGS B original raster

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-legs-b-image-on-push.yml'
      - '.recovery/legs-b-*.b64'

permissions:
  contents: write

jobs:
  recover-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact original raster
        shell: bash
        run: |
          set -euo pipefail
          cat .recovery/legs-b-00.b64 \
              .recovery/legs-b-01.b64 \
              .recovery/legs-b-02.b64 \
              .recovery/legs-b-03.b64 \
              .recovery/legs-b-04.b64 \
              .recovery/legs-b-05.b64 \
            | tr -d '\r\n' \
            | base64 --decode > assets/anatomy/legs-b-original.jpg

          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/anatomy/legs-b-original.jpg')
          b = p.read_bytes()
          if not (b.startswith(b'\xff\xd8\xff') and b.endswith(b'\xff\xd9')):
              raise SystemExit('Reconstructed file is not a valid JPEG stream')
          print(f'Reconstructed {p}: {len(b)} bytes')
          PY

      - name: Commit original image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/anatomy/legs-b-original.jpg
          if git diff --cached --quiet; then
            echo "Original JPEG already exists and matches."
            exit 0
          fi
          git commit -m "Add original LEGS B anatomy raster"
          git push origin HEAD:main
