name: Recover LEGS B original raster

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-legs-b-image-on-push.yml'
      - '.recovery2/legs-b-*.b64'

permissions:
  contents: write

jobs:
  recover-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify exact raster
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib

          chunks = [
              ('00a', 3000),
              ('00b', 3000),
              *[(f'{i:02d}', 6000) for i in range(1, 11)],
              ('11', 5440),
          ]
          pieces = []
          for name, expected in chunks:
              p = Path(f'.recovery2/legs-b-{name}.b64')
              text = ''.join(p.read_text().split())
              if len(text) != expected:
                  raise SystemExit(f'Chunk {name}: expected {expected} chars, got {len(text)}')
              try:
                  pieces.append(base64.b64decode(text, validate=True))
              except Exception as exc:
                  raise SystemExit(f'Chunk {name} is invalid Base64: {exc}')

          raw = b''.join(pieces)
          expected_sha = 'aa41a6a10cb21d13c2e7f1785d349e74e7a032b08c93af709f2d61df09191b9d'
          actual_sha = hashlib.sha256(raw).hexdigest()
          if actual_sha != expected_sha:
              raise SystemExit(f'SHA mismatch: expected {expected_sha}, got {actual_sha}')
          if not (raw.startswith(b'\xff\xd8\xff') and raw.endswith(b'\xff\xd9')):
              raise SystemExit('Reconstructed data is not a valid JPEG stream')

          target = Path('assets/anatomy/legs-b-original.jpg')
          target.write_bytes(raw)
          print(f'Wrote {target}: {len(raw)} bytes, sha256={actual_sha}')
          PY

      - name: Commit original image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/anatomy/legs-b-original.jpg
          if git diff --cached --quiet; then
            echo "Original JPEG already exists and matches."
            exit 0
          fi
          git commit -m "Add exact original LEGS B anatomy raster"
          git push origin HEAD:main
