name: Recover LEGS B original raster

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-legs-b-image-on-push.yml'
      - '.recovery/legs-b-*.b64'

permissions:
  contents: write

jobs:
  recover-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate staged chunks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          for i in range(6):
              p = Path(f'.recovery/legs-b-{i:02d}.b64')
              s = ''.join(p.read_text().split())
              print(i, 'chars=', len(s), 'sha256=', hashlib.sha256(s.encode()).hexdigest())
              try:
                  raw = base64.b64decode(s, validate=True)
              except Exception as e:
                  print('BAD CHUNK', i, repr(e))
                  raise
              print(i, 'decoded=', len(raw))
          PY

      - name: Reconstruct exact original raster
        shell: bash
        run: |
          set -euo pipefail
          : > assets/anatomy/legs-b-original.jpg
          for i in 00 01 02 03 04 05; do
            tr -d '\r\n' < ".recovery/legs-b-${i}.b64" | base64 --decode >> assets/anatomy/legs-b-original.jpg
          done
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/anatomy/legs-b-original.jpg')
          b = p.read_bytes()
          if not (b.startswith(b'\xff\xd8\xff') and b.endswith(b'\xff\xd9')):
              raise SystemExit('Reconstructed file is not a valid JPEG stream')
          print(f'Reconstructed {p}: {len(b)} bytes')
          PY

      - name: Commit original image
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/anatomy/legs-b-original.jpg
          if git diff --cached --quiet; then
            echo "Original JPEG already exists and matches."
            exit 0
          fi
          git commit -m "Add original LEGS B anatomy raster"
          git push origin HEAD:main
