name: Build anatomy assets

on:
  push:
    branches: [main]
    paths:
      - 'public/assets/anatomy/*.webp'
      - '.github/workflows/build-anatomy-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Convert canonical anatomy artwork to PNG
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('public/assets/anatomy')
          expected = ['push-a', 'legs-a', 'pull-a', 'push-b', 'legs-b', 'arms']
          for name in expected:
              src = root / f'{name}.webp'
              dst = root / f'{name}.png'
              with Image.open(src) as im:
                  im = im.convert('RGBA')
                  im.save(dst, format='PNG', optimize=True)
                  with Image.open(dst) as check:
                      check.verify()
              print(f'{src} -> {dst}')
          PY
      - name: Commit generated PNG masters
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/anatomy/*.png
          if git diff --cached --quiet; then
            echo 'No anatomy asset changes.'
          else
            git commit -m 'Generate browser-safe anatomy PNG assets'
            git push origin HEAD:main
          fi
