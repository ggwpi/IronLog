name: Recover IronLog source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download current public production chunks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .recovery_tmp recovered src
          mkdir -p .recovery_tmp recovered src

          BASE='https://ironlog-v2-two.vercel.app'
          EXPECTED_ETAGS=(
            '6e3d4c7679c36cb2d54b70e7c88d25b5'
            '32faf9cbf04731bb7ba9fa0b52bd89ae'
            'abd0a875deaeff4d92eb636c9e797f29'
            '476b7bc8827650a42166b48a31c43718'
            '5f9fb7b7968741b9b6ad24a94d37a93e'
          )

          for i in 0 1 2 3 4; do
            echo "Downloading p${i}.txt"
            curl --connect-timeout 10 --max-time 60 --retry 3 --retry-all-errors \
              --compressed -fsSL \
              -H 'Cache-Control: no-cache' \
              "${BASE}/p${i}.txt" \
              -D ".recovery_tmp/p${i}.headers" \
              -o ".recovery_tmp/p${i}.txt"

            bytes=$(wc -c < ".recovery_tmp/p${i}.txt")
            etag=$(awk 'BEGIN{IGNORECASE=1} /^etag:/ {gsub(/\r|\"/,"",$2); print $2}' ".recovery_tmp/p${i}.headers" | tail -n1)
            first=$(head -c 16 ".recovery_tmp/p${i}.txt")
            last=$(tail -c 16 ".recovery_tmp/p${i}.txt")
            echo "p${i}: ${bytes} bytes etag=${etag} first=${first} last=${last}"

            if grep -qi '^[[:space:]]*<html' ".recovery_tmp/p${i}.txt"; then
              echo "ERROR: p${i}.txt returned HTML instead of Base64"
              exit 1
            fi

            if [ -n "$etag" ] && [ "$etag" != "${EXPECTED_ETAGS[$i]}" ]; then
              echo "ERROR: p${i}.txt changed while recovery was being prepared."
              echo "Expected ETag ${EXPECTED_ETAGS[$i]}, got ${etag}."
              echo "Refusing to combine chunks from different application versions."
              exit 1
            fi
          done

      - name: Decode and reconstruct full source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, html as htmlmod, re

          root = Path('.')
          temp = root / '.recovery_tmp'
          parts = []

          for i in range(5):
              text = (temp / f'p{i}.txt').read_text(encoding='utf-8')
              clean = re.sub(r'\s+', '', text)
              if not re.fullmatch(r'[A-Za-z0-9+/]*={0,2}', clean):
                  bad = [(n, repr(ch)) for n, ch in enumerate(clean) if ch not in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='][:20]
                  raise SystemExit(f'p{i} contains non-Base64 characters: {bad}')
              parts.append(clean)
              print(f'p{i}: chars={len(clean)} mod4={len(clean)%4} prefix={clean[:12]} suffix={clean[-12:]}')

          # This exactly mirrors the deployed browser loader: concatenate the text
          # chunks first, then Base64-decode the complete string once.
          b64 = ''.join(parts)
          print('Joined Base64 chars:', len(b64), 'mod4=', len(b64) % 4)
          print('Joined prefix:', b64[:20])
          print('Joined suffix:', b64[-20:])

          if not b64.startswith('H4sI'):
              raise SystemExit('Combined payload does not start with gzip Base64 marker H4sI')
          if len(b64) % 4 == 1:
              raise SystemExit('Combined payload has impossible Base64 length')

          # Preserve valid terminal padding, or add it if omitted.
          stripped = b64.rstrip('=')
          b64 = stripped + '=' * ((4 - len(stripped) % 4) % 4)

          try:
              compressed = base64.b64decode(b64, validate=True)
          except Exception as exc:
              raise SystemExit(f'Base64 decode failed: {exc}')

          print('Compressed bytes:', len(compressed))
          print('Gzip magic:', compressed[:2].hex())
          if not compressed.startswith(b'\x1f\x8b'):
              raise SystemExit('Decoded bytes are not gzip')

          try:
              app_bytes = gzip.decompress(compressed)
          except Exception as exc:
              raise SystemExit(f'Gzip decompression failed: {exc}')

          app_html = app_bytes.decode('utf-8')
          if '<html' not in app_html.lower() or 'IronLog' not in app_html:
              raise SystemExit('Decoded output is not the IronLog application')

          recovered = root / 'recovered'
          src = root / 'src'
          payload_dir = recovered / 'payload'
          recovered.mkdir(parents=True, exist_ok=True)
          src.mkdir(parents=True, exist_ok=True)
          payload_dir.mkdir(parents=True, exist_ok=True)

          (root / 'index.html').write_text(app_html, encoding='utf-8')
          (recovered / 'original-deployment.html').write_text(app_html, encoding='utf-8')
          (recovered / 'payload.b64').write_text(b64 + '\n', encoding='utf-8')
          for i, part in enumerate(parts):
              (payload_dir / f'p{i}.txt').write_text(part + '\n', encoding='utf-8')

          style_blocks = re.findall(r'<style(?:\s[^>]*)?>(.*?)</style>', app_html, flags=re.I | re.S)
          script_blocks = re.findall(r'<script(?![^>]*\bsrc=)(?:\s[^>]*)?>(.*?)</script>', app_html, flags=re.I | re.S)
          css = '\n\n/* ---- recovered style block ---- */\n\n'.join(s.strip() for s in style_blocks if s.strip())
          js = '\n\n// ---- recovered script block ----\n\n'.join(s.strip() for s in script_blocks if s.strip())
          (src / 'styles.css').write_text(css + ('\n' if css else ''), encoding='utf-8')
          (src / 'app.js').write_text(js + ('\n' if js else ''), encoding='utf-8')

          external_scripts = re.findall(r'<script[^>]*\bsrc=["\']([^"\']+)["\'][^>]*>', app_html, flags=re.I)
          links = re.findall(r'<link[^>]*\bhref=["\']([^"\']+)["\'][^>]*>', app_html, flags=re.I)
          inventory = [
              '# IronLog recovered source inventory', '',
              '- Recovery source: `https://ironlog-v2-two.vercel.app/p0.txt` … `p4.txt`',
              f'- Recovered HTML bytes: {len(app_bytes)}',
              f'- SHA-256: `{hashlib.sha256(app_bytes).hexdigest()}`',
              f'- Inline style blocks: {len(style_blocks)}',
              f'- Inline script blocks: {len(script_blocks)}',
              f'- External script references: {len(external_scripts)}',
              f'- Link references: {len(links)}', '',
              '## External scripts',
          ] + [f'- `{htmlmod.escape(x)}`' for x in external_scripts] + ['', '## Link references'] + [f'- `{htmlmod.escape(x)}`' for x in links]
          (recovered / 'INVENTORY.md').write_text('\n'.join(inventory) + '\n', encoding='utf-8')

          print('SUCCESS')
          print('Recovered HTML bytes:', len(app_bytes))
          print('Inline CSS blocks:', len(style_blocks))
          print('Inline JS blocks:', len(script_blocks))
          PY

      - name: Write repository metadata
        shell: bash
        run: |
          cat > README.md <<'EOF'
          # IronLog

          IronLog source reconstructed from the public production payload chunks.

          ## Source layout
          - `index.html` — exact decoded runnable application.
          - `src/styles.css` — extracted inline CSS.
          - `src/app.js` — extracted inline JavaScript.
          - `recovered/original-deployment.html` — preserved exact decoded snapshot.
          - `recovered/payload.b64` — concatenated Base64/GZIP payload.
          - `recovered/payload/p0.txt` … `p4.txt` — exact recovered chunks.
          - `recovered/INVENTORY.md` — recovery metadata.
          EOF

          cat > vercel.json <<'EOF'
          {
            "cleanUrls": true,
            "trailingSlash": false
          }
          EOF

      - name: Commit recovered source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .recovery_tmp
          git config user.name 'IronLog Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html src recovered README.md vercel.json
          if git diff --cached --quiet; then
            echo 'No recovery changes to commit.'
            exit 0
          fi
          git commit -m '[recovery-output] Restore full IronLog source from public payload chunks'
          git push origin HEAD:main
