name: Recover IronLog source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download payload
        run: |
          set -euo pipefail
          rm -rf .recovery_tmp recovered
          mkdir -p .recovery_tmp recovered
          BASE="https://ironlog-nd8ylypxu-ziveliya1-4493s-projects.vercel.app"
          SHARE="FgZp65T0p4vsxQvTzRPWTcXSNQca365Z"

          for i in 0 1 2 3 4; do
            echo "Downloading p${i}"
            curl --connect-timeout 10 --max-time 60 --retry 2 --retry-delay 3 \
              -fsSL "${BASE}/p${i}.txt?_vercel_share=${SHARE}&nocache=$(date +%s)" \
              -o ".recovery_tmp/p${i}.txt"
            echo "p${i} size: $(wc -c < .recovery_tmp/p${i}.txt)"
          done

      - name: Recover
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re,base64,gzip
          p=Path('.recovery_tmp')
          chunks=[]
          for i in range(5):
            t=(p/f'p{i}.txt').read_text(errors='ignore')
            print('p',i,'first chars:',repr(t[:50]))
            chunks.append(t)
          data=''.join(chunks)
          data=re.sub(r'[^A-Za-z0-9+/=]','',data)
          data += '='*((4-len(data)%4)%4)
          raw=base64.b64decode(data)
          out=gzip.decompress(raw).decode('utf-8')
          if '<html' not in out.lower():
            raise Exception('Recovered data is not HTML')
          Path('index.html').write_text(out,encoding='utf-8')
          Path('recovered/original-deployment.html').write_text(out,encoding='utf-8')
          print('Recovered',len(out),'bytes')
          PY

      - name: Commit
        run: |
          git config user.name "IronLog Recovery Bot"
          git config user.email actions@users.noreply.github.com
          git add .
          git commit -m "[recovery-output] Restore IronLog source" || true
          git push
