name: Recover IronLog source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download deployed payload from immutable deployment
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .recovery_tmp recovered src
          mkdir -p .recovery_tmp recovered src

          BASE='https://ironlog-nd8ylypxu-ziveliya1-4493s-projects.vercel.app'
          SHARE='FgZp65T0p4vsxQvTzRPWTcXSNQca365Z'

          for i in 0 1 2 3 4; do
            url="${BASE}/p${i}.txt?_vercel_share=${SHARE}&cb=$(date +%s)-${i}"
            echo "Downloading p${i}.txt from immutable deployment"
            curl --fail --show-error --location --retry 3 --retry-delay 2 \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              -A 'Mozilla/5.0 IronLog-Recovery' \
              "$url" \
              -D ".recovery_tmp/p${i}.headers" \
              -o ".recovery_tmp/p${i}.txt"
            test -s ".recovery_tmp/p${i}.txt"
            echo "p${i}: $(wc -c < ".recovery_tmp/p${i}.txt") bytes"
          done

      - name: Decode and reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re, html as htmlmod, hashlib, zlib

          root = Path('.')
          parts = []
          for i in range(5):
              text = (root / '.recovery_tmp' / f'p{i}.txt').read_text(encoding='utf-8')
              clean = re.sub(r'\s+', '', text)
              parts.append(clean)
              print(f'p{i}: chars={len(clean)} mod4={len(clean)%4} prefix={clean[:8]} suffix={clean[-8:]}')

          allowed = re.compile(r'^[A-Za-z0-9+/]*={0,2}$')
          for i, part in enumerate(parts):
              if not allowed.fullmatch(part):
                  raise SystemExit(f'p{i} contains non-Base64 characters')

          candidates = []

          # Strategy 1: exact browser behavior — concatenate Base64 first, then decode.
          joined = ''.join(parts)
          print('Joined Base64 chars:', len(joined), 'mod4=', len(joined) % 4, 'prefix=', joined[:12])
          if len(joined) % 4 != 1:
              padded = joined + ('=' * ((4 - len(joined) % 4) % 4))
              try:
                  raw = base64.b64decode(padded, validate=True)
                  candidates.append(('joined-base64', raw))
                  print('joined-base64 decoded bytes:', len(raw))
              except Exception as e:
                  print('joined-base64 decode failed:', repr(e))
          else:
              print('joined-base64 skipped: impossible Base64 remainder 1; this indicates a mixed/truncated payload')

          # Strategy 2: decode each part separately if chunk boundaries happen to align.
          decoded_parts = []
          per_part_ok = True
          for i, part in enumerate(parts):
              if len(part) % 4 == 1:
                  print(f'per-part decode unavailable: p{i} has impossible remainder 1')
                  per_part_ok = False
                  break
              try:
                  padded = part + ('=' * ((4 - len(part) % 4) % 4))
                  decoded_parts.append(base64.b64decode(padded, validate=True))
              except Exception as e:
                  print(f'per-part decode failed for p{i}:', repr(e))
                  per_part_ok = False
                  break
          if per_part_ok:
              raw = b''.join(decoded_parts)
              candidates.append(('decoded-parts-then-joined', raw))
              print('decoded-parts-then-joined bytes:', len(raw))

          def decompress_candidate(name, raw):
              methods = [
                  ('gzip.decompress', lambda b: gzip.decompress(b)),
                  ('zlib-gzip', lambda b: zlib.decompress(b, 16 + zlib.MAX_WBITS)),
              ]
              for method_name, fn in methods:
                  try:
                      out = fn(raw)
                      text = out.decode('utf-8')
                      if '<html' in text.lower() and 'IronLog' in text:
                          print(f'SUCCESS: {name} via {method_name}, html bytes={len(out)}')
                          return text
                      print(f'{name} via {method_name} decompressed but did not look like IronLog')
                  except Exception as e:
                      print(f'{name} via {method_name} failed:', repr(e))
              return None

          app_html = None
          selected = None
          for name, raw in candidates:
              app_html = decompress_candidate(name, raw)
              if app_html is not None:
                  selected = name
                  break

          if app_html is None:
              raise SystemExit('Unable to reconstruct IronLog. The payload chunks are still inconsistent or corrupted. Check printed part lengths/mod4 values.')

          recovered = root / 'recovered'
          recovered.mkdir(exist_ok=True)
          (recovered / 'original-deployment.html').write_text(app_html, encoding='utf-8')
          (root / 'index.html').write_text(app_html, encoding='utf-8')

          style_blocks = re.findall(r'<style(?:\s[^>]*)?>(.*?)</style>', app_html, flags=re.I | re.S)
          script_blocks = re.findall(r'<script(?![^>]*\bsrc=)(?:\s[^>]*)?>(.*?)</script>', app_html, flags=re.I | re.S)
          css = '\n\n/* ---- recovered style block ---- */\n\n'.join(s.strip() for s in style_blocks if s.strip())
          js = '\n\n// ---- recovered script block ----\n\n'.join(s.strip() for s in script_blocks if s.strip())
          (root / 'src' / 'styles.css').write_text(css + ('\n' if css else ''), encoding='utf-8')
          (root / 'src' / 'app.js').write_text(js + ('\n' if js else ''), encoding='utf-8')

          payload_dir = recovered / 'payload'
          payload_dir.mkdir(parents=True, exist_ok=True)
          for i, part in enumerate(parts):
              (payload_dir / f'p{i}.txt').write_text(part + '\n', encoding='utf-8')

          external_scripts = re.findall(r'<script[^>]*\bsrc=["\']([^"\']+)["\'][^>]*>', app_html, flags=re.I)
          links = re.findall(r'<link[^>]*\bhref=["\']([^"\']+)["\'][^>]*>', app_html, flags=re.I)
          inventory = [
              '# IronLog recovered source inventory', '',
              f'- Recovery strategy: `{selected}`',
              f'- Recovered HTML bytes: {len(app_html.encode("utf-8"))}',
              f'- SHA-256: `{hashlib.sha256(app_html.encode()).hexdigest()}`',
              f'- Inline style blocks: {len(style_blocks)}',
              f'- Inline script blocks: {len(script_blocks)}',
              f'- External script references: {len(external_scripts)}',
              f'- Link references: {len(links)}', '',
              '## External scripts',
          ] + [f'- `{htmlmod.escape(x)}`' for x in external_scripts] + ['', '## Link references'] + [f'- `{htmlmod.escape(x)}`' for x in links]
          (recovered / 'INVENTORY.md').write_text('\n'.join(inventory) + '\n', encoding='utf-8')
          PY

      - name: Write repository metadata
        shell: bash
        run: |
          cat > README.md <<'EOF'
          # IronLog

          Reconstructed source from the live IronLog Vercel deployment.

          - `index.html` — exact decoded runnable production app.
          - `recovered/original-deployment.html` — preserved decoded production snapshot.
          - `src/styles.css` — extracted inline CSS.
          - `src/app.js` — extracted inline JavaScript.
          - `recovered/payload/p0.txt` … `p4.txt` — original payload chunks.
          - `recovered/INVENTORY.md` — recovery metadata.

          The recovered production HTML is the behavioral source of truth. Future edits should migrate functionality from the monolithic snapshot into maintainable source files without changing behavior unintentionally.
          EOF
          cat > vercel.json <<'EOF'
          {
            "cleanUrls": true,
            "trailingSlash": false
          }
          EOF

      - name: Commit recovered source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .recovery_tmp
          git config user.name 'IronLog Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html src recovered README.md vercel.json
          if git diff --cached --quiet; then
            echo 'No recovery changes to commit.'
            exit 0
          fi
          git commit -m '[recovery-output] Restore full IronLog source from Vercel'
          git push origin HEAD:main
