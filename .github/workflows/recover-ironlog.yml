name: Recover IronLog source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download payload
        run: |
          set -euo pipefail
          rm -rf .recovery_tmp recovered
          mkdir -p .recovery_tmp recovered
          BASE="https://ironlog-nd8ylypxu-ziveliya1-4493s-projects.vercel.app"
          SHARE="FgZp65T0p4vsxQvTzRPWTcXSNQca365Z"
          for i in 0 1 2 3 4; do
            curl -fsSL "${BASE}/p${i}.txt?_vercel_share=${SHARE}" -o ".recovery_tmp/p${i}.txt"
          done

      - name: Recover
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re,base64,gzip
          p=Path('.recovery_tmp')
          chunks=[]
          for i in range(5):
            t=(p/f'p{i}.txt').read_text(errors='ignore')
            print('p',i,'start',repr(t[:80]))
            chunks.append(t)
          data=''.join(chunks)
          # remove anything that is not base64 (Vercel error wrappers/html)
          data=re.sub(r'[^A-Za-z0-9+/=]','',data)
          raw=base64.b64decode(data+'='*((4-len(data)%4)%4))
          out=gzip.decompress(raw).decode()
          if '<html' not in out.lower():
            raise Exception('Recovered data is not HTML')
          Path('index.html').write_text(out)
          Path('recovered/original-deployment.html').write_text(out)
          print('Recovered',len(out),'bytes')
          PY

      - name: Commit
        run: |
          git config user.name "IronLog Recovery Bot"
          git config user.email actions@users.noreply.github.com
          git add .
          git commit -m "[recovery-output] Restore IronLog source" || true
          git push
