name: Recover IronLog source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download deployed payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .recovery_tmp recovered src
          mkdir -p .recovery_tmp recovered src
          SHARE='7vtgamVFCZ68SVvSSwGMa2p74qRTpMhB'
          for i in 0 1 2 3 4; do
            url="https://ironlog-v2-two.vercel.app/p${i}.txt?_vercel_share=${SHARE}"
            echo "Downloading p${i}.txt"
            curl --fail --show-error --location --retry 3 --retry-delay 2 \
              -A 'Mozilla/5.0 IronLog-Recovery' "$url" -o ".recovery_tmp/p${i}.txt"
            test -s ".recovery_tmp/p${i}.txt"
            echo "p${i}: $(wc -c < ".recovery_tmp/p${i}.txt") bytes"
          done

      - name: Decode and reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, re, html as htmlmod, hashlib

          root = Path('.')
          parts = [(root / '.recovery_tmp' / f'p{i}.txt').read_text(encoding='utf-8').strip() for i in range(5)]
          b64 = re.sub(r'\s+', '', ''.join(parts))
          print('Base64 chars:', len(b64))
          print('Prefix:', b64[:12])
          if not b64.startswith('H4sI'):
              raise SystemExit('Payload does not start like gzip Base64; Vercel likely returned an auth/error page')
          if len(b64) % 4:
              b64 += '=' * (4 - len(b64) % 4)
          raw = base64.b64decode(b64, validate=True)
          app_html = gzip.decompress(raw).decode('utf-8')
          if '<html' not in app_html.lower() or 'IronLog' not in app_html:
              raise SystemExit('Decoded payload does not look like IronLog HTML')

          recovered = root / 'recovered'
          recovered.mkdir(exist_ok=True)
          (recovered / 'original-deployment.html').write_text(app_html, encoding='utf-8')
          (root / 'index.html').write_text(app_html, encoding='utf-8')

          style_blocks = re.findall(r'<style(?:\s[^>]*)?>(.*?)</style>', app_html, flags=re.I | re.S)
          script_blocks = re.findall(r'<script(?![^>]*\bsrc=)(?:\s[^>]*)?>(.*?)</script>', app_html, flags=re.I | re.S)
          css = '\n\n/* ---- recovered style block ---- */\n\n'.join(s.strip() for s in style_blocks if s.strip())
          js = '\n\n// ---- recovered script block ----\n\n'.join(s.strip() for s in script_blocks if s.strip())
          (root / 'src' / 'styles.css').write_text(css + ('\n' if css else ''), encoding='utf-8')
          (root / 'src' / 'app.js').write_text(js + ('\n' if js else ''), encoding='utf-8')

          payload_dir = recovered / 'payload'
          payload_dir.mkdir(parents=True, exist_ok=True)
          for i, part in enumerate(parts):
              (payload_dir / f'p{i}.txt').write_text(part + '\n', encoding='utf-8')

          external_scripts = re.findall(r'<script[^>]*\bsrc=["\']([^"\']+)["\'][^>]*>', app_html, flags=re.I)
          links = re.findall(r'<link[^>]*\bhref=["\']([^"\']+)["\'][^>]*>', app_html, flags=re.I)
          inventory = [
              '# IronLog recovered source inventory', '',
              f'- Recovered HTML bytes: {len(app_html.encode("utf-8"))}',
              f'- SHA-256: `{hashlib.sha256(app_html.encode()).hexdigest()}`',
              f'- Inline style blocks: {len(style_blocks)}',
              f'- Inline script blocks: {len(script_blocks)}',
              f'- External script references: {len(external_scripts)}',
              f'- Link references: {len(links)}', '',
              '## External scripts',
          ] + [f'- `{htmlmod.escape(x)}`' for x in external_scripts] + ['', '## Link references'] + [f'- `{htmlmod.escape(x)}`' for x in links]
          (recovered / 'INVENTORY.md').write_text('\n'.join(inventory) + '\n', encoding='utf-8')
          print('Recovered HTML bytes:', len(app_html.encode('utf-8')))
          print('Inline CSS blocks:', len(style_blocks), 'Inline JS blocks:', len(script_blocks))
          PY

      - name: Write repository metadata
        shell: bash
        run: |
          cat > README.md <<'EOF'
          # IronLog

          Reconstructed source from the live IronLog Vercel deployment.

          - `index.html` — exact decoded runnable production app.
          - `recovered/original-deployment.html` — preserved decoded production snapshot.
          - `src/styles.css` — extracted inline CSS.
          - `src/app.js` — extracted inline JavaScript.
          - `recovered/payload/p0.txt` … `p4.txt` — original payload chunks.
          - `recovered/INVENTORY.md` — recovery metadata.

          The recovered production HTML is the behavioral source of truth. Future edits should migrate functionality from the monolithic snapshot into maintainable source files without changing behavior unintentionally.
          EOF
          cat > vercel.json <<'EOF'
          {
            "cleanUrls": true,
            "trailingSlash": false
          }
          EOF

      - name: Commit recovered source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .recovery_tmp
          git config user.name 'IronLog Recovery Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html src recovered README.md vercel.json
          if git diff --cached --quiet; then
            echo 'No recovery changes to commit.'
            exit 0
          fi
          git commit -m '[recovery-output] Restore full IronLog source from Vercel'
          git push origin HEAD:main
