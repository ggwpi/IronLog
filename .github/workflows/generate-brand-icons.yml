name: Generate IronLog brand icons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-brand-icons.yml'
      - 'assets/ironlog-app-icon.svg'

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install --quiet pillow
      - name: Render app icons
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFilter

          out = Path('assets')
          out.mkdir(exist_ok=True)

          def render(size, path):
              scale = size / 512
              img = Image.new('RGB', (size, size), '#040605')
              draw = ImageDraw.Draw(img)

              # Gentle IronLog green-black radial atmosphere.
              glow = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              gd = ImageDraw.Draw(glow)
              r = int(size * .36)
              cx, cy = size // 2, int(size * .43)
              gd.ellipse((cx-r, cy-r, cx+r, cy+r), fill=(150, 205, 25, 36))
              glow = glow.filter(ImageFilter.GaussianBlur(max(6, int(size * .10))))
              img = Image.alpha_composite(img.convert('RGBA'), glow)

              # Same lightning geometry used by the app header / launch screen.
              pts = [(302,75),(147,310),(248,310),(209,437),(375,196),(274,196)]
              pts = [(int(x*scale), int(y*scale)) for x,y in pts]

              bolt_glow = Image.new('RGBA', (size, size), (0,0,0,0))
              bgd = ImageDraw.Draw(bolt_glow)
              bgd.polygon(pts, fill=(210,255,22,180))
              bolt_glow = bolt_glow.filter(ImageFilter.GaussianBlur(max(3, int(size*.025))))
              img = Image.alpha_composite(img, bolt_glow)

              d = ImageDraw.Draw(img)
              d.polygon(pts, fill=(210,255,22,255))
              img.convert('RGB').save(path, 'PNG', optimize=True)

          render(180, out / 'apple-touch-icon.png')
          render(192, out / 'ironlog-icon-192.png')
          render(512, out / 'ironlog-icon-512.png')
          PY
      - name: Commit generated icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/apple-touch-icon.png assets/ironlog-icon-192.png assets/ironlog-icon-512.png
          git diff --cached --quiet || git commit -m 'Generate IronLog raster app icons'
          git push
